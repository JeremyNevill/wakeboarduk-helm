# Default values for wuk.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
environment: test
site: wuk
replicaCount: 1

image:
  repository: ghcr.io/jeremynevill/wakeboarduk
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: sha-30646ff

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

# /healthz is a 2-byte 200 on the running sites. "/" renders the DB-backed
# homepage, and that probe was restarting pods whenever the app was busy.
# Liveness failureThreshold * periodSeconds is 600s, the ffmpeg cap, so a
# CPU-starved health check does not kill a pod mid-transcode. Readiness stays
# shorter: the only replica drops out of the Service after about a minute of
# missed health checks, without a restart that would abort the upload.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.class: nginx
    # Site-wide cap. /Media/UploadVideo has its own Ingress (see upload).
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  # Separate Ingress because ingress-nginx annotations are per object, not per path.
  # 300m leaves room above the app's 256MB video limit for multipart overhead.
  # 900s send/read timeouts cover a slow upload plus the 10-minute ffmpeg cap.
  upload:
    enabled: true
    path: /Media/UploadVideo
    pathType: Prefix
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/proxy-body-size: "300m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Scheduler uses requests only. This repo does not record the OKE node shape.
# No CPU limit: ffmpeg and Kestrel share the node, and a 1 CPU cap would stall
# /healthz for the whole transcode. 3Gi is the top of the useful range so the
# process, a 256MB upload, and ffmpeg can coexist.
resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    memory: 3Gi

# ffmpeg scratch via Path.GetTempPath() (/tmp). sizeLimit evicts the pod if
# scratch exceeds 2Gi; it is not a scheduling request.
tmpVolume:
  enabled: true
  mountPath: /tmp
  sizeLimit: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
